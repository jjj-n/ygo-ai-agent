[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ygo-engine-bridge"
version = "0.1.0"
description = "Python bridge to ygopro-engine subprocess"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ygo_engine_bridge"]
