[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ygo-battle"
version = "0.1.0"
description = "YGO Battle MCP Server - auto-battle system"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "ygo-engine-bridge",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ygo_battle"]

[tool.hatch.metadata]
allow-direct-references = true
